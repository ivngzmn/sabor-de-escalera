# Preserve the reviewed routing security fix under pnpm's scoped selector.
overrides:
  '@vercel/routing-utils>path-to-regexp': 6.3.0

# Only this pinned installer needs to validate/provision its optional binary.
# Sharp 0.35.5 ships platform binaries through optional dependencies and has no
# install lifecycle script; real decoding is verified after frozen installation.
allowBuilds:
  esbuild@0.28.2: true
strictDepBuilds: true
